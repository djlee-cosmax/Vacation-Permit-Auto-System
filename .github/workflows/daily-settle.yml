name: 매일 잔여 차감 정산

# 잔여 차감이 브라우저에서만 일어나던 것을 서버로 옮긴다.
#
# 브라우저 차감은 화면 목록(leaves 배열)을 보고 계산해서, 새로고침·다른 PC·
# 목록 비움 중 하나만 걸려도 조용히 건너뛴다. 실제로 2026-05 개시부터 08-26
# 까지 balanceLogs 에 deduct 가 한 건도 없었다 — 넉 달 내내 차감이 안 됐고
# 서무가 손으로 메워 왔다.
#
# 여기서는 "처리됐는데 아직 차감 안 된 휴가증" 을 서버에서 직접 찾아 반영한다.
# 화면 상태와 무관하므로 서무가 무엇을 누르든 잔여가 맞는다.
#
# 차감하면 마이너스가 되는 사람은 건드리지 않고 로그에 남긴다 — 초과 사용이나
# 휴가증 작성 오류라 사람이 봐야 한다.

on:
  # 매일 08:00 UTC = 17:00 KST — 서무가 그날 처리한 것을 퇴근 무렵에 반영한다.
  #
  # ★ 예약 시각은 그대로 지켜지지 않는다. GitHub 공용 러너가 붐비면 미뤄진다.
  #   20:00 예약이던 34회를 재 보니 88%(30회)가 22~02시에 돌았고,
  #   05:52 · 06:18 · 09:05 까지 밀린 적도 있었다 (2026-09-28 실측).
  #   서무는 **오전에** 잔여를 확인하므로, 09시에 도는 날이 있으면 그날 아침엔
  #   아직 안 빠져 있다. 그래서 세 시간 당겨 여유를 둔다.
  #
  #   대신 17시 이후에 처리한 휴가증은 다음 날 밤으로 넘어간다.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '미리보기만 (반영하지 않음)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: daily-settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install deps
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Settle deductions
        working-directory: scripts
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
          ACTION: settle
          SKIP_NEGATIVE: '1'
          # ★ 참일 때 값을 빈 문자열로 두면 안 된다. Actions 식도 (A && B) || C
          #   로 세는데 빈 문자열은 거짓이라, || 가 넘어가 **늘 OK** 가 된다.
          #   그래서 미리보기(dry_run=true)가 실제 반영으로 돌았다
          #   (2026-09-28 실측 — 19명이 그대로 차감됐다).
          #   참일 때 값이 비지 않도록 조건을 뒤집는다.
          CONFIRM: ${{ inputs.dry_run != 'true' && 'OK' || '' }}
        run: node auth-admin.js
